<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Train Route Station Manager demo</title><link rel="stylesheet" href="demo.css?v=20261025b"></head>
<body><main class="demo train-app"><div class="train-panel"><header class="train-head"><div><p class="demo-kicker">Interactive prototype</p><h1 class="demo-title">Manage Stations</h1></div><div class="train-legend"><span>Train available</span><span>Unavailable</span></div></header>
<div class="demo-content" style="padding:18px 0 0"><label class="demo-field" for="line-select">Rail line</label><select class="train-select" id="line-select"><option>LRT 1</option><option>LRT 2</option><option>MRT 3</option><option>PNR</option></select><div class="station-carousel"><button type="button" class="station-arrow" id="station-prev" aria-label="Previous stations">‹</button><div class="station-row" id="stations" aria-label="Stations on selected line"></div><button type="button" class="station-arrow" id="station-next" aria-label="Next stations">›</button></div>
<div class="train-actions"><label class="demo-field">Move train to station number<input id="move-target" type="number" min="1" value="2"></label><button class="demo-btn" type="button" id="move">Move train</button></div><p class="demo-status" id="train-status" role="status">Select a station or enter a destination number to move the train.</p></div></div></main>
<script>
const lines={
 "LRT 1":["Fernando Poe Jr.","Balintawak","Monumento","5th Avenue","R. Papa","Abad Santos","Blumentritt","Tayuman","Bambang","Doroteo Jose","Carriedo","Central Terminal","United Nations","Pedro Gil","Quirino","Vito Cruz","Gil Puyat","Libertad","EDSA","Baclaran","Redemptorist-Aseana","MIA Road","PITX","Ninoy Aquino Avenue","Dr. Santos"],
 "LRT 2":["Recto","Legarda","Pureza","V. Mapa","J. Ruiz","Gilmore","Betty Go-Belmonte","Araneta Center-Cubao","Anonas","Katipunan","Santolan","Marikina-Pasig","Antipolo"],
 "MRT 3":["North Avenue","Quezon Avenue","GMA-Kamuning","Araneta Center-Cubao","Santolan-Annapolis","Ortigas","Shaw Boulevard","Boni","Guadalupe","Buendia","Ayala","Magallanes","Taft Avenue"],
 "PNR":["Tutuban","Blumentritt","Laon Laan","España","Sta. Mesa","Pandacan","Paco","San Andres","Vito Cruz","Buendia","EDSA","Nichols","FTI","Bicutan","Sucat","Alabang"]
};
const statusByLine={};let activeLine="LRT 1",selected=-1,current=0,stationStart=0;
Object.keys(lines).forEach(line=>{statusByLine[line]=lines[line].map((_,i)=>i%2===0);});
const list=document.getElementById("stations");
function render(){list.replaceChildren();lines[activeLine].slice(stationStart,stationStart+3).forEach((name,offset)=>{const index=stationStart+offset;const card=document.createElement("button");card.type="button";card.className="station-card"+(statusByLine[activeLine][index]?"":" unavailable")+(selected===index?" selected":"");card.setAttribute("aria-pressed",selected===index?"true":"false");const icon=document.createElement("span");icon.className="train-icon";icon.setAttribute("aria-hidden","true");const label=document.createElement("span");label.className="station-name";label.textContent=(index+1)+" · "+name;const state=document.createElement("span");state.className="demo-muted";state.textContent=statusByLine[activeLine][index]?"Train available":"No train right now";card.append(icon,label,state);card.addEventListener("click",()=>{selected=index;render();document.getElementById("train-status").textContent=name+" — "+(statusByLine[activeLine][index]?"train available":"currently unavailable")+".";});list.append(card);});document.getElementById("move-target").max=String(lines[activeLine].length);}
document.getElementById("station-prev").addEventListener("click",()=>{stationStart=Math.max(0,stationStart-1);render();});document.getElementById("station-next").addEventListener("click",()=>{stationStart=Math.min(lines[activeLine].length-3,stationStart+1);render();});
document.getElementById("line-select").addEventListener("change",event=>{activeLine=event.target.value;selected=-1;current=0;stationStart=0;render();document.getElementById("train-status").textContent="Showing stations on "+activeLine+".";});
document.getElementById("move").addEventListener("click",()=>{const destination=Number(document.getElementById("move-target").value)-1;if(!Number.isInteger(destination)||destination<0||destination>=lines[activeLine].length){document.getElementById("train-status").textContent="Enter a station number from 1 to "+lines[activeLine].length+".";return;}current=destination;stationStart=Math.min(lines[activeLine].length-3,Math.max(0,destination-1));selected=destination;render();document.getElementById("train-status").textContent="Train moved to "+lines[activeLine][current]+" (station "+(current+1)+").";});
render();
</script></body></html>
