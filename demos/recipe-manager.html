<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Manager demo</title><link rel="stylesheet" href="demo.css?v=20261025b"></head>
<body><main class="demo"><header class="demo-top"><div><p class="demo-kicker">Interactive prototype</p><h1 class="demo-title">Recipe Manager</h1></div><span class="demo-notice">Sample data · browser-only</span></header>
<div class="recipe-app">
  <aside class="recipe-sidebar"><p class="recipe-brand"><img src="../assets/Source%20Codes/RecipeManager/cooking.png" alt=""> Recipe Box</p><input class="recipe-search" id="search" type="search" placeholder="Find a recipe" aria-label="Search recipes"><div class="recipe-list" id="recipe-list"></div></aside>
  <section class="recipe-detail" aria-live="polite"><h2 id="recipe-title">Chicken Adobo</h2><p class="demo-muted" id="recipe-meta">A home-style favorite · 4 servings</p><div class="recipe-columns"><div><h3>Ingredients</h3><ul id="ingredients"></ul></div><div><h3>Method</h3><ol id="steps"></ol></div></div><div class="recipe-photo"><img src="../assets/Source%20Codes/RecipeManager/adobo.jpg" alt="Adobo recipe photo"><img src="../assets/Source%20Codes/RecipeManager/sisig.jpg" alt="Sisig recipe photo"><img src="../assets/Source%20Codes/RecipeManager/lechon%20kawali.jpg" alt="Lechon kawali recipe photo"></div>
  <form class="recipe-add" id="add-form"><label class="demo-field">New recipe<input id="new-name" placeholder="e.g. Pancit"></label><label class="demo-field">First ingredient<input id="new-ingredient" placeholder="e.g. Rice noodles"></label><button class="demo-btn" type="submit">Add recipe</button></form><p class="demo-status" id="status" role="status"></p></section>
</div><section class="recipe-focus"><button class="recipe-back" id="recipe-back" type="button" aria-label="Back">‹</button><h1><span>◉</span> CREATE YOUR RECIPE</h1><div class="create-layout"><div class="create-left"><label>Recipe Name<input id="focus-name" placeholder="(e.g. Adobo)"></label><label>Ingredient Name<input id="focus-ingredient" placeholder="(e.g. Chicken)"></label><label>Quantity<input id="focus-quantity" placeholder="(e.g. 1 kg)"></label><button class="recipe-action" id="add-ingredient" type="button">ADD INGREDIENT</button><ul class="recipe-items" id="focus-ingredients"></ul></div><div class="create-right"><label>Recipe Step<textarea id="focus-step" placeholder="(e.g. Boil 2 cups of water...)"></textarea></label><button class="recipe-action" id="add-step" type="button">ADD STEP</button><ol class="recipe-items" id="focus-steps"></ol></div></div><div class="recipe-photos"><div></div><label class="photo-pick">ATTACH PHOTO<input id="recipe-photo" type="file" accept="image/*"><span>＋</span></label><div></div></div><div class="recipe-bottom"><button class="recipe-action" id="save-recipe" type="button">SAVE RECIPE</button><button class="recipe-action" id="new-recipe" type="button">ADD NEW RECIPE</button><button class="recipe-action" id="view-recipes" type="button">VIEW SAVED RECIPE</button></div><p class="focus-status" id="focus-status" role="status"></p></section></main>
<style>
body:has(.recipe-focus){padding:0;background:#ffb33e;font-family:Georgia,'Times New Roman',serif}.demo:has(.recipe-focus){width:100%;min-height:100vh;padding:16px;border:0;border-radius:0;box-shadow:none;background:#ffb33e}.demo:has(.recipe-focus)>.demo-top{display:none}.recipe-app{display:none}.recipe-focus{position:relative;min-height:calc(100vh - 32px);padding:26px 4% 20px;border-radius:24px;background:#fff;font-family:Georgia,'Times New Roman',serif;color:#713006}.recipe-focus h1{margin:2px 0 34px;text-align:center;font:bold clamp(1.4rem,4vw,3rem) Georgia,serif;color:#713006}.recipe-focus h1 span{font-size:.7em;margin-right:12px}.recipe-back{position:absolute;left:4%;top:18px;width:58px;height:58px;border:0;background:#a44b0e;color:#fff;font:bold 2rem Georgia}.create-layout{display:grid;grid-template-columns:.75fr 1.4fr;gap:26px}.create-left,.create-right{display:flex;flex-direction:column;align-items:flex-start;gap:12px}.recipe-focus label:not(.photo-pick){display:grid;gap:5px;width:100%;font:700 1rem Arial,sans-serif;letter-spacing:.04em}.recipe-focus input:not([type=file]),.recipe-focus textarea{width:100%;border:1.5px solid #ff921c;background:#fff;padding:12px 4px;color:#713006;font:1rem Arial,sans-serif}.recipe-focus textarea{height:150px;resize:vertical}.recipe-action{min-height:44px;padding:10px 24px;border:0;background:#a44b0e;color:#ffc14d;font:bold .88rem Georgia,serif;cursor:pointer}.recipe-action:hover{background:#823702}.recipe-items{margin:0;padding-left:24px;font: .85rem Arial,sans-serif}.recipe-photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin:24px 0}.recipe-photos>div,.photo-pick{height:140px;border:2px solid #88400e;background:#ffc45f}.photo-pick{display:grid;place-items:center;position:relative;background:#a44b0e;color:#ffc14d;font-weight:bold}.photo-pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.photo-pick span{font:3rem Arial;color:white}.recipe-bottom{display:flex;justify-content:center;gap:18px}.recipe-bottom .recipe-action{min-width:22%;min-height:68px;font-size:1.1rem}.focus-status{text-align:center;font: .85rem Arial,sans-serif;color:#276b31}@media(max-width:680px){.recipe-focus{padding:74px 18px 20px}.create-layout{grid-template-columns:1fr}.recipe-photos{grid-template-columns:1fr 1fr}.recipe-photos>div:last-child{display:none}.recipe-bottom{flex-wrap:wrap}.recipe-bottom .recipe-action{flex:1;min-width:42%;font-size:.8rem}.recipe-focus textarea{height:110px}}
</style><script>
(()=>{const ingredients=[],steps=[];const $=id=>document.getElementById(id),status=$('focus-status');function render(id,items){$(id).replaceChildren(...items.map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));}$('add-ingredient').onclick=()=>{const name=$('focus-ingredient').value.trim(),qty=$('focus-quantity').value.trim();if(!name)return;ingredients.push(qty?name+' — '+qty:name);render('focus-ingredients',ingredients);$('focus-ingredient').value='';$('focus-quantity').value='';};$('add-step').onclick=()=>{const text=$('focus-step').value.trim();if(!text)return;steps.push(text);render('focus-steps',steps);$('focus-step').value='';};$('save-recipe').onclick=()=>{const name=$('focus-name').value.trim();if(!name){status.textContent='Enter a recipe name to save.';return;}if(!ingredients.length||!steps.length){status.textContent='Add at least one ingredient and one recipe step.';return;}const saved=JSON.parse(sessionStorage.getItem('lim-recipes')||'[]');saved.push({name,ingredients,steps});sessionStorage.setItem('lim-recipes',JSON.stringify(saved));status.textContent=name+' saved in this preview.';};$('new-recipe').onclick=()=>{$('focus-name').value='';ingredients.length=0;steps.length=0;render('focus-ingredients',ingredients);render('focus-steps',steps);status.textContent='Ready for a new recipe.';};$('recipe-back').onclick=()=>$('new-recipe').click();$('view-recipes').onclick=()=>{const saved=JSON.parse(sessionStorage.getItem('lim-recipes')||'[]');status.textContent=saved.length?saved.map(item=>item.name).join(' · '):'No saved recipes yet.';};$('recipe-photo').onchange=e=>{const file=e.target.files[0];if(file){const box=document.querySelector('.photo-pick');box.style.backgroundImage='url('+URL.createObjectURL(file)+')';box.style.backgroundSize='cover';box.style.backgroundPosition='center';box.querySelector('span').textContent='PHOTO ADDED';}};})();
</script>
<script>
const recipes = [
 {name:"Chicken Adobo", servings:4, ingredients:["1 kg chicken pieces","½ cup soy sauce","⅓ cup vinegar","6 cloves garlic","2 bay leaves","1 tsp peppercorns"],steps:["Combine chicken, soy sauce, garlic, and pepper. Rest for 20 minutes.","Add vinegar and bay leaves; simmer without stirring for 5 minutes.","Cover and cook until tender. Uncover and reduce the sauce."]},
 {name:"Pork Sisig", servings:3, ingredients:["500 g pork","1 onion, diced","2 tbsp calamansi juice","1 tbsp soy sauce","1 chili, sliced"],steps:["Cook the pork until tender, then chop into small pieces.","Sauté onion and chili; add pork and seasonings.","Finish with calamansi and serve hot."]},
 {name:"Lechon Kawali", servings:4, ingredients:["1 kg pork belly","2 bay leaves","1 tsp salt","4 cups water","Oil for frying"],steps:["Simmer pork with bay leaves and salt until fork-tender.","Cool and dry the pork thoroughly.","Fry until crisp, rest briefly, and chop to serve."]}
];
let selected=0; const list=document.getElementById("recipe-list");
function renderList(query=""){list.replaceChildren();recipes.forEach((recipe,index)=>{if(!recipe.name.toLowerCase().includes(query.toLowerCase()))return;const button=document.createElement("button");button.className="recipe-item";button.type="button";button.textContent=recipe.name;button.setAttribute("aria-current",index===selected?"true":"false");button.addEventListener("click",()=>{selected=index;renderList(document.getElementById("search").value);renderRecipe();});list.append(button);});}
function renderRecipe(){const recipe=recipes[selected];document.getElementById("recipe-title").textContent=recipe.name;document.getElementById("recipe-meta").textContent="A home-style favorite · "+recipe.servings+" servings";const ingredients=document.getElementById("ingredients"),steps=document.getElementById("steps");ingredients.replaceChildren();steps.replaceChildren();recipe.ingredients.forEach(text=>{const item=document.createElement("li");item.textContent=text;ingredients.append(item);});recipe.steps.forEach(text=>{const item=document.createElement("li");item.textContent=text;steps.append(item);});}
document.getElementById("search").addEventListener("input",event=>renderList(event.target.value));
document.getElementById("add-form").addEventListener("submit",event=>{event.preventDefault();const name=document.getElementById("new-name").value.trim(),ingredient=document.getElementById("new-ingredient").value.trim();if(!name||!ingredient)return;recipes.push({name,servings:2,ingredients:[ingredient],steps:["Add your preparation steps in the full desktop application."]});selected=recipes.length-1;event.target.reset();renderList(document.getElementById("search").value);renderRecipe();document.getElementById("status").textContent="“"+name+"” added to this temporary demo.";});
renderList();renderRecipe();
</script></body></html>
