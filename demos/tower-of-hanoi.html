<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower of Hanoi demo</title><link rel="stylesheet" href="demo.css"></head>
<body><main class="demo hanoi"><header><p class="demo-kicker" style="color:#ffe0bb;text-align:center">Interactive prototype</p><h1 class="demo-title">Tower of Hanoi</h1></header><section class="demo-content">
<div class="hanoi-controls"><label class="demo-field">Disks<input id="disk-count" type="number" value="5" min="3" max="8"></label><button type="button" class="demo-btn" id="reset">Reset</button><button type="button" class="demo-btn" id="hint">Show hint</button><button type="button" class="demo-btn" id="solve">Auto solve</button></div>
<p class="demo-status" id="message" role="status">Choose a rod with a disk, then choose where to move it.</p><div class="hanoi-board" id="board" aria-label="Puzzle rods"></div><div class="hanoi-foot"><span>Moves: <strong id="moves">0</strong></span><span>Minimum: <strong id="minimum">31</strong></span><span id="progress">Select a rod</span></div></section></main>
<script>
const board=document.getElementById("board"),colors=["#ff2828","#ff9f1c","#ffe128","#42df59","#00a665","#185dff","#8218e8","#ed26dc"];
let rods=[],selected=-1,moves=0,diskCount=5,playing=false,solverTimer=null;
function reset(){if(solverTimer)clearTimeout(solverTimer);solverTimer=null;playing=false;selected=-1;diskCount=Math.max(3,Math.min(8,Number(document.getElementById("disk-count").value)||5));document.getElementById("disk-count").value=diskCount;rods=[Array.from({length:diskCount},(_,i)=>diskCount-i),[],[]];moves=0;document.getElementById("moves").textContent="0";document.getElementById("minimum").textContent=String(2**diskCount-1);document.getElementById("message").textContent="Choose a rod with a disk, then choose where to move it.";document.getElementById("progress").textContent="Select a rod";render();}
function render(){board.replaceChildren();rods.forEach((rod,index)=>{const button=document.createElement("button");button.type="button";button.className="hanoi-rod"+(selected===index?" selected":"");button.dataset.label=String.fromCharCode(65+index);button.setAttribute("aria-label","Rod "+String.fromCharCode(65+index)+", "+rod.length+" disks");rod.forEach((disk)=>{const item=document.createElement("span");item.className="hanoi-disk";item.style.width=(28+disk*20)+"px";item.style.background=colors[diskCount-disk];item.setAttribute("aria-label",disk+" disk");button.append(item);});button.addEventListener("click",()=>choose(index));board.append(button);});}
function choose(index){if(playing)return;if(selected<0){if(!rods[index].length){document.getElementById("message").textContent="Pick a rod that has a disk.";return;}selected=index;render();return;}if(selected===index){selected=-1;render();return;}move(selected,index);selected=-1;render();}
function move(from,to){const disk=rods[from].at(-1),top=rods[to].at(-1);if(!disk)return false;if(top&&top<disk){document.getElementById("message").textContent="A larger disk cannot go on a smaller disk.";return false;}rods[from].pop();rods[to].push(disk);moves++;document.getElementById("moves").textContent=moves;document.getElementById("message").textContent="Disk moved to rod "+String.fromCharCode(65+to)+".";if(rods[2].length===diskCount){document.getElementById("progress").textContent="Puzzle solved!";document.getElementById("message").textContent="Solved in "+moves+" moves. Great work!";}return true;}
function nextHint(){const start=rods.map(rod=>rod.join(",")).join("|");const queue=[start],previous=new Map([[start,null]]),moveFrom=new Map();let goal=null;for(let cursor=0;cursor<queue.length&&goal===null;cursor++){const state=queue[cursor],stateRods=state.split("|").map(part=>part?part.split(",").map(Number):[]);if(stateRods[2].length===diskCount){goal=state;break;}for(let from=0;from<3;from++){const disk=stateRods[from].at(-1);if(!disk)continue;for(let to=0;to<3;to++){if(from===to)continue;const top=stateRods[to].at(-1);if(top&&top<disk)continue;const next=stateRods.map(rod=>rod.slice());next[from].pop();next[to].push(disk);const key=next.map(rod=>rod.join(",")).join("|");if(previous.has(key))continue;previous.set(key,state);moveFrom.set(key,[from,to]);queue.push(key);}}}if(!goal||goal===start){document.getElementById("message").textContent="The puzzle is already solved.";return;}let step=goal;while(previous.get(step)!==start)step=previous.get(step);const [from,to]=moveFrom.get(step);document.getElementById("message").textContent="Hint: move the top disk from rod "+String.fromCharCode(65+from)+" to rod "+String.fromCharCode(65+to)+".";}
function solveSteps(n,from,to,aux,out){if(n===0)return;solveSteps(n-1,from,aux,to,out);out.push([from,to]);solveSteps(n-1,aux,to,from,out);}
document.getElementById("reset").addEventListener("click",reset);document.getElementById("disk-count").addEventListener("change",reset);document.getElementById("hint").addEventListener("click",nextHint);
document.getElementById("solve").addEventListener("click",()=>{if(playing){clearTimeout(solverTimer);playing=false;document.getElementById("solve").textContent="Auto solve";return;}if(moves>0){reset();}const steps=[];solveSteps(diskCount,0,2,1,steps);playing=true;document.getElementById("solve").textContent="Stop";let i=0;function tick(){if(i>=steps.length){playing=false;document.getElementById("solve").textContent="Auto solve";return;}move(steps[i][0],steps[i][1]);i++;render();solverTimer=setTimeout(tick,280);}tick();});
reset();
</script></body></html>
