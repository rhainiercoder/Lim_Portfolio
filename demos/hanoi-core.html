<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower of Hanoi · Puzzle</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#8b3a19}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#8b3a19}.game{width:min(1120px,100%);min-height:calc(100vh - 40px);margin:auto;padding:0 28px 24px;border-radius:26px;background:#0f7a1d;display:flex;flex-direction:column}.title{margin:0;padding:22px 0 12px;text-align:center;font:900 clamp(25px,4vw,42px)/1 Impact,"Arial Narrow",sans-serif}.toolbar{display:flex;align-items:end;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 0}.stat-field{display:grid;gap:4px;color:white;font:bold 13px Arial;text-align:center}.stat-field input{width:64px;height:48px;border:2px solid #8b3a19;background:#fff;color:#8b3a19;text-align:center;font:20px Arial}.moves input{background:#e9e9e9}.action{min-height:46px;border:0;border-radius:8px;padding:0 20px;background:#e67e22;color:white;font:bold 15px Arial;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 #b75d15}.action:hover{background:#f39c12}.action.stop{background:#9b2c24}.status{min-height:24px;margin:0;text-align:center;color:#fff;font:14px Arial}.board{flex:1;min-height:300px;display:flex;align-items:stretch;gap:12px;padding:18px 14px 8px;position:relative}.rod{position:relative;flex:1;min-width:0;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:4px;padding:0 0 38px;border:2px solid transparent;border-radius:12px;background:transparent;cursor:pointer}.rod:hover,.rod.selected{border-color:#8beefc;background:#ffffff0c}.rod:before{content:"";position:absolute;bottom:36px;left:50%;width:18px;height:calc(100% - 75px);min-height:130px;transform:translateX(-50%);border-radius:9px;background:#d35400}.rod:after{content:attr(data-label);position:absolute;bottom:2px;left:50%;display:grid;width:32px;height:32px;transform:translateX(-50%);place-items:center;border-radius:50%;background:#6b2c04;color:white;font:bold 17px Arial}.disk{z-index:1;height:20px;max-width:88%;border:1px solid #0004;border-radius:99px;transition:transform .18s;box-shadow:inset 0 -2px 0 #0002}.rod.hint{animation:hint-flash .55s ease-in-out 4}@keyframes hint-flash{50%{background:#ffffff3b;border-color:#ffe86a}}.actions-foot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding-top:8px}.rules{position:absolute;z-index:4;right:12px;top:10px;width:min(330px,90%);padding:22px;border-radius:18px;background:#19b34a;color:white;box-shadow:0 14px 40px #0004}.rules h2{margin:0 0 8px;font:24px Impact,sans-serif}.rules p,.rules li{font:14px/1.45 Arial}.rules[hidden]{display:none}@media(max-width:640px){body{padding:7px}.game{min-height:calc(100vh - 14px);padding:0 10px 14px;border-radius:17px}.toolbar{gap:8px}.stat-field{font-size:10px}.stat-field input{width:52px;height:40px}.action{min-height:40px;padding:0 12px;font-size:12px}.board{padding-inline:2px;gap:2px;min-height:270px}.rod{padding-bottom:34px}.disk{height:16px}.rod:before{width:12px;bottom:32px}.rod:after{width:27px;height:27px}.actions-foot{gap:7px}}
</style></head><body><main class="game"><h1 class="title">VIRTUAL TOWER OF HANOI</h1><section class="toolbar" aria-label="Puzzle controls"><label class="stat-field">NO. OF DISKS<input id="disk-count" type="number" min="1" max="8" value="8"></label><label class="stat-field">NO. OF RODS<input id="rod-count" type="number" min="3" max="5" value="3"></label><label class="stat-field moves">NO. OF MOVES<input id="move-count" value="0" readonly></label><button class="action" id="hint">SHOW HINT</button><button class="action" id="solve">AUTO SOLVE</button><button class="action" id="rules-toggle">RULES</button><button class="action" id="reset">RESET</button></section><p class="status" id="status" role="status" aria-live="polite">Choose the top disk on a rod, then choose a destination.</p><section class="board" id="board" aria-label="Puzzle rods"></section><div class="actions-foot"><span class="status" id="progress">Minimum moves: 255</span></div><aside class="rules" id="rules" hidden><h2>HOW TO PLAY</h2><ul><li>Move one disk at a time.</li><li>Only the top disk on a rod can move.</li><li>A larger disk cannot go on a smaller disk.</li><li>Move every disk to the last rod to solve the puzzle.</li></ul><button class="action" id="rules-close">BACK</button></aside></main><script>
(()=>{const $=id=>document.getElementById(id);let numDisks=8,numRods=3,moveCount=0,selected=-1,rods=[],autoTimer=null,autoMoves=[],autoIndex=0;function reset(){stopAuto();numDisks=Math.max(1,Math.min(8,Number($('disk-count').value)||8));numRods=Math.max(3,Math.min(5,Number($('rod-count').value)||3));$('disk-count').value=numDisks;$('rod-count').value=numRods;rods=Array.from({length:numRods},()=>[]);for(let d=numDisks;d>=1;d--)rods[0].push(d);moveCount=0;selected=-1;render();$('status').textContent='Choose the top disk on a rod, then choose a destination.';$('progress').textContent='Minimum moves: '+(2**numDisks-1)}function render(){const board=$('board');board.replaceChildren(...rods.map((stack,index)=>{const rod=document.createElement('button');rod.type='button';rod.className='rod'+(selected===index?' selected':'');rod.dataset.label=String.fromCharCode(65+index);rod.setAttribute('aria-label','Rod '+rod.dataset.label+', '+stack.length+' disks');stack.forEach(size=>{const disk=document.createElement('span');disk.className='disk';disk.style.width=(18+size*5.2)+'%';disk.style.background=['#ff1a1a','#ffa41a','#ffe81a','#3ce83c','#00a651','#0047ff','#7f00ff','#e81aff'][(size-1)%8];disk.title='Disk '+size;rod.append(disk)});rod.onclick=()=>choose(index);return rod}));$('move-count').value=moveCount}function legal(from,to){const disk=rods[from]?.at(-1),target=rods[to]?.at(-1);return !!disk&&from!==to&&(!target||target>disk)}function move(from,to,automatic=false){if(!legal(from,to)){if(!automatic)$('status').textContent='Illegal move: a larger disk cannot be placed on a smaller disk.';return false}rods[to].push(rods[from].pop());moveCount++;selected=-1;render();if(rods[numRods-1].length===numDisks){$('status').textContent='Solved in '+moveCount+' moves!'}else $('status').textContent='Disk moved from rod '+String.fromCharCode(65+from)+' to rod '+String.fromCharCode(65+to)+'.';return true}function choose(index){if(selected<0){if(!rods[index].length){$('status').textContent='This rod has no disk to move.';return}selected=index;render();return}if(selected===index){selected=-1;render();return}move(selected,index)}function hint(){for(let from=0;from<numRods;from++){if(!rods[from].length)continue;for(let to=0;to<numRods;to++){if(legal(from,to)){document.querySelectorAll('.rod').forEach((rod,index)=>{if(index===from||index===to){rod.classList.remove('hint');void rod.offsetWidth;rod.classList.add('hint')}});$('status').textContent='Hint: move the top disk from rod '+String.fromCharCode(65+from)+' to rod '+String.fromCharCode(65+to)+'.';return}}}$('status').textContent='No legal moves.'}function routeToLastRod(){const total=numRods**numDisks,queue=new Int32Array(total),parent=new Int32Array(total).fill(-2),fromAt=new Uint8Array(total),toAt=new Uint8Array(total),power=Array.from({length:numDisks},(_,i)=>numRods**i);let start=0;rods.forEach((stack,r)=>stack.forEach(d=>{start+=r*power[d-1]}));let goal=0;for(let d=0;d<numDisks;d++)goal+=(numRods-1)*power[d];let head=0,tail=0;queue[tail++]=start;parent[start]=-1;while(head<tail&&parent[goal]===-2){const state=queue[head++],positions=[];let value=state;for(let d=0;d<numDisks;d++){positions.push(value%numRods);value=Math.floor(value/numRods)}const top=Array(numRods).fill(0);for(let d=0;d<numDisks;d++)if(!top[positions[d]])top[positions[d]]=d+1;for(let a=0;a<numRods;a++){const disk=top[a];if(!disk)continue;for(let b=0;b<numRods;b++){if(a===b||(top[b]&&top[b]<disk))continue;const next=state+(b-a)*power[disk-1];if(parent[next]!==-2)continue;parent[next]=state;fromAt[next]=a;toAt[next]=b;queue[tail++]=next;if(next===goal)break}if(parent[goal]!==-2)break}}if(parent[goal]===-2)return[];const path=[];for(let state=goal;state!==start;state=parent[state])path.push([fromAt[state],toAt[state]]);return path.reverse()}function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}$('solve').textContent='AUTO SOLVE';$('solve').classList.remove('stop')}function solve(){if(autoTimer){stopAuto();$('status').textContent='Auto solve stopped.';return}autoMoves=routeToLastRod();if(!autoMoves.length){$('status').textContent='Puzzle already solved on the last rod.';return}autoIndex=0;$('solve').textContent='STOP';$('solve').classList.add('stop');autoTimer=setInterval(()=>{const [from,to]=autoMoves[autoIndex++];move(from,to,true);if(autoIndex>=autoMoves.length)stopAuto()},250)}$('hint').onclick=hint;$('solve').onclick=solve;$('reset').onclick=reset;$('disk-count').onchange=reset;$('rod-count').onchange=reset;$('rules-toggle').onclick=()=>{$('rules').hidden=!$('rules').hidden};$('rules-close').onclick=()=>{$('rules').hidden=true};reset()})();
</script></body></html>
