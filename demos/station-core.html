<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Train Route Station Manager · Manage</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#050519;background:#2b18ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:#2b18ff}.manager{width:min(1099px,100%);min-height:calc(100vh - 32px);margin:auto;padding:8px 24px 18px;border-radius:24px;background:#afc6ff;display:grid;grid-template-rows:auto auto 1fr auto auto;position:relative}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px}.header h1{grid-column:2;margin:0;color:#2b18ff;text-align:center;font:900 clamp(25px,4vw,44px)/1 Impact,"Arial Narrow",sans-serif;text-transform:uppercase}.legend{grid-column:3;justify-self:end;display:grid;gap:4px;color:#2b18ff;font:bold 12px Arial}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:18px;height:18px;background:#00c853}.legend span:last-child i{background:#ff3d3d}.line-row{display:flex;justify-content:center;padding:6px}.line-name{min-width:200px;padding:12px 22px;border-radius:16px;background:#2b18ff;color:white;text-align:center;font:20px Impact,sans-serif}.carousel{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;align-items:center;gap:10px;min-height:300px}.arrow{width:50px;height:50px;border:0;border-radius:50%;background:#2b18ff;color:white;font:bold 30px Arial;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,4vw,50px);align-items:center}.station{min-width:0;height:clamp(170px,24vw,264px);display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:12px;padding:20px 8px 24px;border:2px solid transparent;border-radius:28px;background:#c8d6ff;color:#2b18ff;cursor:pointer;transition:transform .2s,border-color .2s}.station:hover,.station.current{border-color:#2b18ff;transform:translateY(-3px)}.train-icon{position:relative;width:clamp(60px,8vw,100px);aspect-ratio:1;border-radius:18px;background:#00c853}.train-icon:before{content:"";position:absolute;left:22%;right:22%;top:24%;height:30%;border-radius:6px;background:#fff}.train-icon:after{content:"●　●";position:absolute;left:19%;bottom:7%;color:#fff;font:22px Arial}.station.unavailable .train-icon{background:#ff3d3d}.station-name{max-width:100%;text-align:center;font:900 clamp(11px,1.6vw,17px) Impact,"Arial Narrow",sans-serif;text-transform:uppercase;overflow-wrap:anywhere}.bottom{display:flex;justify-content:center;align-items:center;gap:clamp(8px,2vw,24px);padding:8px 0}.action{min-height:48px;border:0;border-radius:12px;padding:0 24px;background:#2b18ff;color:white;font:18px Impact,sans-serif;cursor:pointer}.action:hover,.action.active{background:#778cff}.move-label{color:#2b18ff;font:bold 14px Arial}.move-input{width:76px;height:42px;border:2px solid #2b18ff;background:#fff;color:#2b18ff;text-align:center;font:bold 16px Arial}.status{min-height:18px;margin:0;text-align:center;color:#192174;font:13px Arial}.overlay{position:absolute;z-index:4;inset:10% 5%;padding:24px;border-radius:28px;background:#fff;box-shadow:0 18px 42px #15104c35;overflow:auto}.overlay[hidden]{display:none}.overlay h2{margin:0 0 18px;text-align:center;color:#2b18ff;font:26px Impact,sans-serif}.overlay-close{position:absolute;right:18px;top:16px;border:0;background:#2b18ff;color:white;width:36px;height:36px;border-radius:50%;font:bold 22px Arial;cursor:pointer}.edit-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(13,auto);gap:8px 24px}.edit-row{display:flex;align-items:center;gap:10px;color:#2b18ff;font-weight:700;font-size:13px}.availability{width:18px;height:18px;border:0;border-radius:50%;background:#ff3d3d;cursor:pointer}.availability.on{background:#00c853}.line-options{display:grid;gap:10px;justify-content:center}.line-choice{min-width:220px;padding:13px;border:0;border-radius:12px;background:#2b18ff;color:#fff;font:20px Impact,sans-serif;cursor:pointer}.line-choice.selected{background:#778cff}@media(max-width:640px){body{padding:6px}.manager{min-height:calc(100vh - 12px);padding:8px;border-radius:16px}.header{grid-template-columns:1fr auto}.header h1{grid-column:1;grid-row:1;text-align:left}.legend{grid-column:2;grid-row:1;font-size:9px}.legend i{width:12px;height:12px}.carousel{grid-template-columns:34px minmax(0,1fr) 34px;gap:3px}.arrow{width:32px;height:32px;font-size:22px}.cards{gap:5px}.station{height:165px;padding:10px 4px;border-radius:18px}.bottom{flex-wrap:wrap}.action{min-height:40px;padding:0 12px;font-size:13px}.move-label{font-size:11px}.move-input{width:60px;height:36px}.edit-grid{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr 1fr}}
</style></head><body><main class="manager"><header class="header"><h1>Manage Stations</h1><div class="legend"><span><i></i>TRAIN AVAILABLE</span><span><i></i>TRAIN UNAVAILABLE</span></div></header><div class="line-row"><span class="line-name" id="line-name">LRT 1</span></div><section class="carousel" aria-label="Station carousel"><button class="arrow" id="previous" type="button" aria-label="Previous station">‹</button><div class="cards" id="cards"></div><button class="arrow" id="next" type="button" aria-label="Next station">›</button></section><div class="bottom"><button class="action" id="edit">EDIT TRAIN</button><button class="action" id="change-line">CHANGE RAIL LINE</button><label class="move-label" for="move-steps">MOVE TRAIN</label><input class="move-input" id="move-steps" aria-label="Number of stations to move" inputmode="numeric"><button class="action" id="move" aria-label="Apply train movement">↵</button></div><p class="status" id="status" role="status" aria-live="polite">Choose a move count and press Enter to rotate train availability.</p><section class="overlay" id="edit-overlay" hidden><button class="overlay-close" data-close aria-label="Close">×</button><h2>EDIT TRAINS</h2><div class="edit-grid" id="edit-grid"></div></section><section class="overlay" id="line-overlay" hidden><button class="overlay-close" data-close aria-label="Close">×</button><h2>RAIL LINES</h2><div class="line-options" id="line-options"></div></section></main><script>
(()=>{const data={"LRT 1":["Fernando Poe Jr.","Balintawak","Monumento","5th Avenue","R. Papa","Abad Santos","Blumentritt","Tayuman","Bambang","Doroteo Jose","Carriedo","Central Terminal","United Nations","Pedro Gil","Quirino","Vito Cruz","Gil Puyat","Libertad","EDSA","Baclaran","Redemptorist-Aseana","MIA Road","PITX","Ninoy Aquino Avenue","Dr. Santos"],"LRT 2":["Recto","Legarda","Pureza","V. Mapa","J. Ruiz","Gilmore","Betty Go-Belmonte","Araneta Center-Cubao","Anonas","Katipunan","Santolan","Marikina-Pasig","Antipolo"],"MRT 3":["North Avenue","Quezon Avenue","GMA-Kamuning","Araneta Center-Cubao","Santolan-Annapolis","Ortigas","Shaw Boulevard","Boni","Guadalupe","Buendia","Ayala","Magallanes","Taft Avenue"],"PNR":["Tutuban","Blumentritt","Laon Laan","España","Sta. Mesa","Pandacan","Paco","San Andres","Vito Cruz","Buendia","EDSA","Nichols","FTI","Bicutan","Sucat","Alabang"]};let states=Object.fromEntries(Object.entries(data).map(([name,stations])=>[name,stations.map((_,i)=>i%2===0)])),lineIndex=0,stationIndex=0,lastClicked=null;const $=id=>document.getElementById(id),lineNames=Object.keys(data);try{const saved=JSON.parse(sessionStorage.getItem('train-manager-state')||'null');if(saved&&saved.states&&saved.states['LRT 1'])states=Object.fromEntries(Object.entries(states).map(([name,base])=>[name,Array.isArray(saved.states[name])&&saved.states[name].length===base.length?saved.states[name]:base]));if(saved&&lineNames.includes(saved.line))lineIndex=lineNames.indexOf(saved.line);if(saved&&Number.isInteger(saved.station))stationIndex=saved.station}catch{}function currentLine(){return lineNames[lineIndex]}function persist(){try{sessionStorage.setItem('train-manager-state',JSON.stringify({states,line:currentLine(),station:stationIndex}))}catch{}}function availableCount(){return states[currentLine()].filter(Boolean).length}function render(){const name=currentLine(),stations=data[name],availability=states[name];stationIndex=(stationIndex+stations.length)%stations.length;$('line-name').textContent=name;const positions=[(stationIndex-1+stations.length)%stations.length,stationIndex,(stationIndex+1)%stations.length];$('cards').replaceChildren(...positions.map((idx,slot)=>{const card=document.createElement('button');card.type='button';card.className='station'+(availability[idx]?'':' unavailable')+(slot===1?' current':'');card.setAttribute('aria-label',stations[idx]+(availability[idx]?', train available':', train unavailable'));const icon=document.createElement('span');icon.className='train-icon';icon.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='station-name';label.textContent=stations[idx];card.append(icon,label);card.onclick=()=>{stationIndex=idx;lastClicked=availability[idx];render();$('status').textContent=stations[idx]+' selected.'};return card}));renderEdit();persist()}function renderEdit(){const stations=data[currentLine()],availability=states[currentLine()];$('edit-grid').replaceChildren(...stations.map((station,i)=>{const row=document.createElement('div');row.className='edit-row';const toggle=document.createElement('button');toggle.type='button';toggle.className='availability'+(availability[i]?' on':'');toggle.setAttribute('aria-label',(availability[i]?'Disable':'Enable')+' train at '+station);toggle.onclick=()=>{availability[i]=!availability[i];lastClicked=availability[i];render();$('status').textContent='Train '+(availability[i]?'available':'unavailable')+' at '+station+'.'};const label=document.createElement('span');label.textContent=station;row.append(toggle,label);return row}));$('edit').classList.toggle('active',!$('edit-overlay').hidden)}function showOverlay(id){$('edit-overlay').hidden=true;$('line-overlay').hidden=true;$(id).hidden=false}function renderLines(){$('line-options').replaceChildren(...lineNames.map((name,i)=>{const button=document.createElement('button');button.type='button';button.className='line-choice'+(i===lineIndex?' selected':'');button.textContent=name;button.onclick=()=>{lineIndex=i;stationIndex=0;lastClicked=null;$('line-overlay').hidden=true;render();$('status').textContent='Showing '+name+'.'};return button}))}function moveTrains(raw){const n=data[currentLine()].length,parsed=Number(raw);if(!Number.isInteger(parsed)||parsed<=0){$('status').textContent='Enter a positive whole number of stations.';return false}const steps=parsed%n;if(!steps){$('status').textContent='The train availability returned to the same station positions.';return true}const old=states[currentLine()].slice();for(let i=0;i<n;i++){const source=(i-steps+n)%n;states[currentLine()][i]=old[source]}render();$('status').textContent='Train availability moved '+steps+' station'+(steps===1?'':'s')+' along '+currentLine()+'.';return true}$('previous').onclick=()=>{stationIndex=(stationIndex-1+data[currentLine()].length)%data[currentLine()].length;render()};$('next').onclick=()=>{stationIndex=(stationIndex+1)%data[currentLine()].length;render()};$('edit').onclick=()=>showOverlay('edit-overlay');$('change-line').onclick=()=>{renderLines();showOverlay('line-overlay')};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>{button.closest('.overlay').hidden=true});$('move').onclick=()=>moveTrains($('move-steps').value);$('move-steps').addEventListener('keydown',event=>{if(event.key==='Enter'){moveTrains(event.currentTarget.value);event.currentTarget.value=''}});render()})();
</script></body></html>
