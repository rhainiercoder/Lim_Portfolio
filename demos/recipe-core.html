<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Manager · Create your recipe</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#6b2c04;background:#ffb341;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:18px;background:#ffb341}.recipe-screen{width:min(1350px,100%);min-height:calc(100vh - 36px);margin:auto;padding:18px 4% 22px;border-radius:24px;background:#fff;position:relative}.topbar{height:84px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center}.back{width:58px;height:58px;border:0;background:#a45115;color:#fff;font-size:30px;cursor:pointer}.title{display:flex;justify-content:center;align-items:center;gap:12px;margin:0;font:700 clamp(24px,3vw,40px) Rockwell,Georgia,serif}.pan{font:28px Arial}.form-grid{display:grid;grid-template-columns:.76fr 1.35fr;gap:26px;padding:14px 12px 0}.field-column{display:grid;align-content:start;gap:13px}.field{display:grid;gap:6px;color:#6b2c04;font-size:15px;font-weight:700;letter-spacing:.04em}.field input,.field textarea{width:100%;min-height:48px;border:2px solid #ff9c22;border-radius:0;padding:8px 4px;background:white;color:#2d2925;font:15px Arial}.field textarea{height:150px;resize:vertical}.add-button,.main-button{border:0;background:#a45115;color:#ffc63a;font:bold 14px Rockwell,Georgia,serif;cursor:pointer;padding:12px 22px}.add-button{justify-self:start;margin-left:12px}.add-button:hover,.main-button:hover{background:#873b09}.step-column{display:grid;align-content:start;justify-items:start;gap:6px}.work-lists{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin:24px 0 20px}.list-box,.photo-box{height:180px;border:2px solid #6b2c04;border-radius:2px;background:#ffc763;overflow:auto}.list-box{list-style:none;margin:0;padding:7px 10px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px;color:#6b2c04;font-size:13px}.remove{border:0;background:transparent;color:#a45115;font-weight:bold;cursor:pointer}.photo-box{display:grid;grid-template-rows:44px 1fr}.photo-label{display:grid;place-items:center;background:#a45115;color:#ffc63a;font:bold 14px Rockwell,Georgia,serif;cursor:pointer}.photo-label input{position:absolute;width:1px;height:1px;opacity:0}.photo-preview{display:grid;place-items:center;color:white;font-size:28px;background:#a45115 center/cover no-repeat}.actions{display:flex;justify-content:center;gap:20px}.main-button{min-width:22%;min-height:70px;font-size:20px}.status{min-height:20px;margin:8px 0 0;text-align:center;font-size:13px;color:#247044}dialog{width:min(640px,92vw);max-height:80vh;border:2px solid #6b2c04;border-radius:16px;padding:22px;color:#6b2c04;background:white}dialog::backdrop{background:#25180f99}.saved-list{display:grid;gap:8px}.saved-row{display:flex;justify-content:space-between;gap:12px;padding:10px;background:#fff1d5}.saved-row button{border:0;background:#a45115;color:#ffc63a;padding:8px 10px;cursor:pointer}@media(max-width:700px){body{padding:8px}.recipe-screen{padding:12px;min-height:calc(100vh - 16px)}.topbar{height:68px;grid-template-columns:44px 1fr 44px}.back{width:42px;height:42px}.form-grid{grid-template-columns:1fr;gap:16px;padding-inline:0}.field textarea{height:110px}.work-lists{grid-template-columns:1fr;gap:10px;margin-block:16px}.list-box,.photo-box{height:135px}.actions{flex-wrap:wrap;gap:8px}.main-button{flex:1;min-width:42%;min-height:54px;font-size:14px}}
</style></head><body><main class="recipe-screen"><header class="topbar"><button class="back" id="clear-form" aria-label="New recipe">‹</button><h1 class="title"><span class="pan" aria-hidden="true">◉</span>CREATE YOUR RECIPE</h1><span></span></header><form id="recipe-form" novalidate><div class="form-grid"><div class="field-column"><label class="field">Recipe Name<input id="recipe-name" placeholder="(e.g. Adobo)" autocomplete="off"></label><label class="field">Ingredient Name<input id="ingredient-name" placeholder="(e.g. Chicken)" autocomplete="off"></label><label class="field">Quantity<input id="quantity" placeholder="(e.g. 1 kg)" autocomplete="off"></label><button class="add-button" id="add-ingredient" type="button">ADD INGREDIENT</button></div><div class="step-column"><label class="field">Recipe Step<textarea id="step" placeholder="(e.g. Boil 2 cups of water...)"></textarea></label><button class="add-button" id="add-step" type="button">ADD STEP</button></div></div><div class="work-lists"><ul class="list-box" id="ingredients" aria-label="Ingredients"></ul><div class="photo-box"><label class="photo-label">ATTACH PHOTO<input id="photo" type="file" accept="image/*"></label><div class="photo-preview" id="photo-preview">＋</div></div><ol class="list-box" id="steps" aria-label="Recipe steps"></ol></div><div class="actions"><button class="main-button" type="submit">SAVE RECIPE</button><button class="main-button" id="add-new" type="button">ADD NEW RECIPE</button><button class="main-button" id="view-saved" type="button">VIEW SAVED RECIPE</button></div><p class="status" id="status" role="status" aria-live="polite"></p></form></main><dialog id="saved-dialog"><button id="close-dialog" class="add-button" type="button">CLOSE</button><h2>Saved recipes</h2><div id="saved-list" class="saved-list"></div></dialog><script>
(()=>{const $=id=>document.getElementById(id),form=$('recipe-form'),status=$('status');let ingredients=[],steps=[],photoData='',editingId=null;let recipes=[];try{recipes=JSON.parse(sessionStorage.getItem('recipe-manager-records')||'[]')}catch{}function persist(){try{sessionStorage.setItem('recipe-manager-records',JSON.stringify(recipes));return true}catch{return false}}function renderList(id,items){const host=$(id);host.replaceChildren(...items.map((item,index)=>{const row=document.createElement('li');row.className='list-row';const text=document.createElement('span');text.textContent=item;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item);remove.onclick=()=>{items.splice(index,1);renderList(id,items)};row.append(text,remove);return row}))}function render(){renderList('ingredients',ingredients);renderList('steps',steps)}function reset(){form.reset();ingredients=[];steps=[];photoData='';editingId=null;$('photo-preview').style.backgroundImage='';$('photo-preview').textContent='＋';render();status.textContent=''}$('add-ingredient').onclick=()=>{const name=$('ingredient-name').value.trim(),quantity=$('quantity').value.trim();if(!name||!quantity){status.textContent='Enter both an ingredient name and quantity.';return}ingredients.push('- '+quantity+' '+name);$('ingredient-name').value='';$('quantity').value='';renderList('ingredients',ingredients);status.textContent='Ingredient added.'};$('add-step').onclick=()=>{const value=$('step').value.trim();if(!value){status.textContent='Enter a recipe step before adding it.';return}steps.push((steps.length+1)+'. '+value);$('step').value='';renderList('steps',steps);status.textContent='Step added.'};$('photo').onchange=event=>{const file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='Choose an image file.';return}const reader=new FileReader();reader.onload=()=>{photoData=String(reader.result);$('photo-preview').style.backgroundImage='url("'+photoData+'")';$('photo-preview').textContent=''};reader.readAsDataURL(file)};form.onsubmit=event=>{event.preventDefault();const name=$('recipe-name').value.trim();if(!name){status.textContent='Please enter a recipe name.';return}if(!ingredients.length){status.textContent='Please add at least one ingredient.';return}if(!steps.length){status.textContent='Please add at least one step.';return}if(editingId){const recipe=recipes.find(item=>item.id===editingId);if(recipe)Object.assign(recipe,{name,ingredients:[...ingredients],steps:[...steps],photo:photoData})}else recipes.push({id:Date.now(),name,ingredients:[...ingredients],steps:[...steps],photo:photoData});if(!persist()){status.textContent='Storage is full. Remove a large photo and try again.';return}status.textContent='Recipe saved.';editingId=null};$('add-new').onclick=reset;$('clear-form').onclick=reset;function openSaved(){const host=$('saved-list');host.replaceChildren();if(!recipes.length){host.textContent='No recipes saved yet.'}else recipes.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(recipe=>{const row=document.createElement('div');row.className='saved-row';const name=document.createElement('strong');name.textContent=recipe.name;const edit=document.createElement('button');edit.textContent='EDIT';edit.onclick=()=>{editingId=recipe.id;$('recipe-name').value=recipe.name;ingredients=[...recipe.ingredients];steps=[...recipe.steps];photoData=recipe.photo||'';$('photo-preview').style.backgroundImage=photoData?'url("'+photoData+'")':'';$('photo-preview').textContent=photoData?'':'＋';render();$('saved-dialog').close();status.textContent='Editing '+recipe.name+'.'};const remove=document.createElement('button');remove.textContent='DELETE';remove.onclick=()=>{recipes=recipes.filter(item=>item.id!==recipe.id);persist();openSaved()};row.append(name,edit,remove);host.append(row)});$('saved-dialog').showModal()}$('view-saved').onclick=openSaved;$('close-dialog').onclick=()=> $('saved-dialog').close();render()})();
</script></body></html>
